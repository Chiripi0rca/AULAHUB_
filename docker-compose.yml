# ============================================================
#  AulaHub
# ============================================================

services:
  # ---- Base de datos ----
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - aulahub-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ---- Backend Spring Boot ----
  backend:
    build: ./backend
    image: aulahub-backend:1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    # Sin puerto al host: el backend es INTERNO. El frontend lo alcanza por la
    # red de Docker como backend:8080 (ver location /api/ en su nginx.conf).

  # ---- Frontend ----
  frontend:
    build: ./frontend
    image: aulahub-frontend:1.0
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: ${API_BASE_URL}
    # Punto de entrada unico de AulaHub. El 80 lo tiene el proxy de la UAS,
    # asi que publicamos en el 8081. Su Apache/Nginx enruta hacia este puerto.
    # Para bloquearlo solo al proxy del host: usa "127.0.0.1:8081:80".
    ports:
      - "8081:80"

volumes:
  aulahub-db:
