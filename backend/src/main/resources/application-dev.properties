spring.application.name=aulahub-backend

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Correo via SMTP (las credenciales reales van en application-local.properties, que no se commitea)
# Vacio = sin SMTP = no se envian correos (no rompe nada).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL base del frontend - se usa para construir el enlace del email de recuperacion
# Cambiar en application-local.properties si el frontend corre en otro puerto/host
frontend.url=http://localhost

# Origenes permitidos por CORS (separados por coma). En dev "*" permite cualquiera (Live Server, etc.)
# En produccion cambiar por el dominio real, ej: https://aulahub.uas.edu.mx
cors.allowed-origins=*

# Swagger UI (solo dev): documentacion interactiva de la API generada por springdoc
# http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha






