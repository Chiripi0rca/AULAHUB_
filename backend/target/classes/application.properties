spring.application.name=aulahub-backend

# Actuator bajo /api para que pase por el mismo proxy de Nginx que el resto de
# la API (en el servidor solo /api/* llega al backend). Solo se expone health:
# GET /api/actuator/health -> {"status":"UP"} si la app y la DB responden.
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
# El resultado del health se cachea: aunque alguien bombardee el endpoint
# (es publico), los chequeos internos (ping a MySQL) corren a lo mucho una
# vez cada 10s y el resto de respuestas salen de memoria.
management.endpoint.health.cache.time-to-live=10s
