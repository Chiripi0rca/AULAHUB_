# ============================================================
#  PRODUCCION - perfil "prod"
#  Arrancar con: -Dspring.profiles.active=prod
#  Los valores sensibles se leen de variables de entorno del servidor.
#  Este archivo SI se commitea: no contiene secretos, solo referencias ${VAR}.
#  Sintaxis ${VAR:default} usa el default si la variable no esta definida.
# ============================================================

# ---- Base de datos ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate ----
# validate: Hibernate nunca modifica el esquema, solo valida contra Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Flyway (migraciones) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- JWT ----
# JWT_SECRET debe ser una cadena aleatoria de al menos 256 bits (32+ caracteres).
# Generar con: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
# Access token de 30 min por defecto: el front lo renueva solo con el refresh
# token, asi que la sesion no se corta. Un token corto reduce la ventana de
# abuso si llega a filtrarse del navegador o del dispositivo.
jwt.expiration=${JWT_EXPIRATION}
# Vigencia del refresh token en dias (sesion "tipo redes sociales"). Es deslizante:
# cada renovacion la empuja hacia adelante, asi el usuario activo nunca re-loguea;
# solo expira tras estar JWT_REFRESH_DAYS dias sin abrir la app. Default 90.
jwt.refresh-expiration-days=${JWT_REFRESH_DAYS:90}

# ---- Correo via SMTP (JavaMailSender) ----
# El envio es asincrono (@Async) y best-effort: si falla, no tumba la accion que lo origino.
# Configura el SMTP de la institucion por variables de entorno. Vacio = sin correo.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Firebase / FCM (notificaciones push) ----
# Ruta al JSON de la cuenta de servicio (Admin SDK). Si esta vacio, el push se deshabilita
# sin romper nada. En el servidor: FIREBASE_CREDENTIALS=/etc/aulahub/firebase-key.json
firebase.credentials-path=${FIREBASE_CREDENTIALS:}

# ---- URL del frontend (para construir el enlace del correo de recuperacion) ----
frontend.url=${FRONTEND_URL}

# ---- CORS: dominio(s) real(es) del frontend, separados por coma ----
# Ej: https://aulahub.uas.edu.mx
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---- Swagger / OpenAPI: apagado en produccion ----
# La documentacion interactiva solo se usa en desarrollo; en prod estas rutas
# devuelven 404 aunque SecurityConfig las tenga en permitAll.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
