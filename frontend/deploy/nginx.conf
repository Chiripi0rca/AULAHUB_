# Sirve los archivos estaticos de AulaHub y reenvia /api al backend.
# Asi AulaHub es UN solo punto de entrada: el proxy de la UAS (Apache/Nginx)
# apunta solo a este puerto y aqui adentro se reparte web vs API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas a la API van al backend (por la red interna de Docker).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # config.js siempre fresco.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
