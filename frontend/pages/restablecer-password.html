<!DOCTYPE html>
<!-- Página pública: permite crear una nueva contraseña usando el token recibido por email -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña - AulaHub</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body class="login-page">
  <div class="page-wrapper">

    <div class="welcome-panel">
      <p class="welcome-title">AulaHub</p>
      <p class="welcome-subtitle">Crea una nueva contraseña segura para tu cuenta.</p>
      <hr class="divider">
      <p class="section-title">Requisitos</p>
      <p class="section-body">
        Mínimo 8 caracteres. Usa al menos una mayúscula, un número
        y un carácter especial (ej. Seguro123!).
      </p>
    </div>

    <div class="login-container">
      <img src="../assets/images/logo.png" alt="Logo FIC" class="logo">
      <h2>Nueva contraseña</h2>

      <form id="form-restablecer">
        <!-- Campo de token manual: oculto si el token viene en la URL, visible si no -->
        <input type="text" id="input-token" placeholder="Pega aquí el token del correo"
               style="display:none" autocomplete="off">
        <input type="password" id="input-password"  placeholder="Nueva contraseña" required>
        <input type="password" id="input-confirmar" placeholder="Confirmar contraseña" required>
        <button type="button" id="btn-guardar">Guardar contraseña</button>
      </form>

      <div id="msg-exito" class="success-msg" style="display:none">
        Contraseña actualizada. <a href="../index.html">Inicia sesión</a>
      </div>

      <p id="msg-error" class="error-msg" style="display:none"></p>

      <a href="../index.html" class="back-link">← Volver al login</a>
    </div>

  </div>
    <script src="../config.js"></script>
    <script type="module" src="../src/pages/restablecer-password.js"></script>
</body>
</html>
